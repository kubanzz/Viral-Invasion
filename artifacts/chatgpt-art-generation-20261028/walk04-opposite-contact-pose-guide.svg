<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Walk 04 opposite-contact pose guide</title>
  <desc id="desc">A schematic only, not game art. The red near hip connects to the back leg and raised heel. The green far hip connects to the front leg and heel contact. Both feet point right. Head, torso and two arms are locked placeholders.</desc>
  <defs>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #263449; }
      .title { font-size: 28px; font-weight: 700; }
      .note { font-size: 18px; }
      .label { font-size: 20px; font-weight: 700; }
      .joint-label { font-size: 17px; }
      .locked { fill: #e8edf2; stroke: #a8b4c2; stroke-width: 4; }
      .arm { fill: none; stroke: #6687ab; stroke-width: 20; stroke-linecap: round; stroke-linejoin: round; }
      .arm-joint { fill: #f4f7fb; stroke: #6687ab; stroke-width: 5; }
      .near { fill: none; stroke: #d94a4f; stroke-width: 25; stroke-linecap: round; stroke-linejoin: round; }
      .far { fill: none; stroke: #21986a; stroke-width: 25; stroke-linecap: round; stroke-linejoin: round; }
      .near-joint { fill: #fff; stroke: #d94a4f; stroke-width: 6; }
      .far-joint { fill: #fff; stroke: #21986a; stroke-width: 6; }
      .leader { fill: none; stroke: #718096; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1024" height="1024" fill="#fff"/>
  <text x="48" y="54" class="title">WALK 04 · OPPOSITE CONTACT</text>
  <text x="48" y="86" class="note">Schematic only — follow the colored hip-to-foot chains.</text>

  <!-- Locked placeholders: one head, one torso and exactly two arms. -->
  <ellipse cx="540" cy="330" rx="180" ry="180" class="locked"/>
  <text x="540" y="330" text-anchor="middle" class="label">HEAD LOCKED</text>
  <text x="540" y="360" text-anchor="middle" class="note">same camera / identity</text>
  <rect x="435" y="510" width="185" height="137" rx="45" class="locked"/>
  <text x="527" y="566" text-anchor="middle" class="label">TORSO</text>
  <text x="527" y="594" text-anchor="middle" class="note">LOCKED</text>
  <path d="M442 526 L391 589 L359 650" class="arm"/>
  <circle cx="442" cy="526" r="13" class="arm-joint"/>
  <circle cx="391" cy="589" r="11" class="arm-joint"/>
  <circle cx="359" cy="650" r="19" class="arm-joint"/>
  <path d="M609 526 L655 568 L703 613" class="arm"/>
  <circle cx="609" cy="526" r="13" class="arm-joint"/>
  <circle cx="655" cy="568" r="11" class="arm-joint"/>
  <circle cx="703" cy="613" r="19" class="arm-joint"/>
  <text x="747" y="530" class="note" fill="#64748b">facing right</text>
  <path d="M752 548 H905" class="leader" marker-end="url(#arrow-gray)"/>

  <!-- FAR leg is intentionally shown first, behind the near hip at overlap. -->
  <path d="M548 645 L581 723 L624 808" class="far"/>
  <path d="M624 808 L605 850 L695 828 L674 809 Z" fill="#dcf6e9" stroke="#21986a" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="548" cy="645" r="15" class="far-joint"/>
  <circle cx="581" cy="723" r="13" class="far-joint"/>
  <circle cx="624" cy="808" r="11" class="far-joint"/>

  <!-- NEAR hip connects to the back leg, rather than the forward boot. -->
  <path d="M478 645 L414 704 L384 787" class="near"/>
  <path d="M384 787 L356 813 L444 850 L430 822 Z" fill="#ffe6e7" stroke="#d94a4f" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="478" cy="645" r="15" class="near-joint"/>
  <circle cx="414" cy="704" r="13" class="near-joint"/>
  <circle cx="384" cy="787" r="11" class="near-joint"/>

  <!-- Exactly two named hip roots; labels avoid disguising which limb leads. -->
  <text x="86" y="665" class="label" style="fill:#bd343b">NEAR BACK</text>
  <text x="86" y="693" class="joint-label">near hip (478,645)</text>
  <path d="M292 675 L343 675 L462 647" class="leader"/>
  <text x="227" y="739" class="joint-label">near knee</text>
  <path d="M319 735 L400 708" class="leader"/>
  <text x="202" y="787" class="joint-label">near ankle</text>
  <path d="M303 783 L370 787" class="leader"/>
  <text x="184" y="827" class="joint-label" style="fill:#bd343b">heel UP</text>
  <path d="M280 822 L349 813" class="leader"/>

  <text x="742" y="660" class="label" style="fill:#16764f">FAR FRONT</text>
  <text x="742" y="688" class="joint-label">far hip (548,645)</text>
  <path d="M729 671 L663 671 L564 649" class="leader"/>
  <text x="742" y="741" class="joint-label">far knee</text>
  <path d="M730 735 L596 724" class="leader"/>
  <text x="768" y="792" class="joint-label">far ankle</text>
  <path d="M754 788 L638 806" class="leader"/>
  <text x="768" y="832" class="joint-label" style="fill:#16764f">toe UP</text>
  <path d="M754 828 L702 828" class="leader"/>

  <path d="M80 850 H944" stroke="#64748b" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="80" y="878" class="joint-label">GROUND y=850</text>
  <circle cx="605" cy="850" r="8" fill="#21986a"/>
  <text x="575" y="885" class="joint-label" style="fill:#16764f">heel CONTACT</text>
  <circle cx="444" cy="850" r="6" fill="#d94a4f"/>
  <path d="M502 850 H522 M512 840 V860" stroke="#d4a228" stroke-width="3"/>
  <text x="459" y="914" class="joint-label">source anchor (512,850)</text>

  <text x="48" y="958" class="note">Two arms + two legs. Keep both boot toes facing right.</text>
  <text x="48" y="987" class="note">Do not mirror the whole character or swap boots without changing hip chains.</text>
</svg>
