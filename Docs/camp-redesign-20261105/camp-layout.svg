  <g id="plant"><ellipse cx="0" cy="0" rx="24" ry="11" fill="#bdd3b2"/><path d="M0 1Q-31-32-12-30Q5-30 0 1Q5-39 21-32Q36-20 0 1" fill="#90b4a0"/><path d="M0 1L-9-21M0 1L18-24" fill="none" stroke="#658c76" stroke-width="2"/></g>
  <g id="cell"><ellipse cy="12" rx="12" ry="5" fill="#365f4e" opacity=".12"/><circle r="12" fill="#fffdf3" stroke="#739b88" stroke-width="2"/><path d="M-12-2Q-3-18 6-9L0-2Z" fill="#9fcaac"/><circle cx="-3" cy="2" r="1.6" fill="#355f51"/><circle cx="4" cy="2" r="1.6" fill="#355f51"/><path d="M-2 7Q1 9 4 6" fill="none" stroke="#355f51" stroke-width="1.3"/></g>
  <g id="target"><path d="M0 0V23M-13 25H13" stroke="#759789" stroke-width="5" stroke-linecap="round"/><circle cy="-7" r="18" fill="#f8f5e7" stroke="#769c8b" stroke-width="3"/><circle cy="-7" r="9" fill="none" stroke="#b0876b" stroke-width="3"/><circle cy="-7" r="3" fill="#b0876b"/></g>
</defs>
<rect width="1680" height="1080" fill="#f6f4e9"/>
<rect width="1208" height="1080" fill="url(#dots)"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#284f42">
  <text x="66" y="66" font-size="14" letter-spacing="3" fill="#7b8c7a">VIRAL INVASION / CAMP DESIGN 01</text>
  <text x="66" y="119" font-size="41" font-weight="700">心核庭院 · 营地重布局</text>
  <text x="68" y="153" font-size="18" fill="#748576">分区成簇，环路连接；让回营成为一段有生活感的整备过程。</text>

  <g transform="translate(0 70) scale(1 .9)">
  <!-- Ecological boundary, grouped around clear paths. -->
  <path d="M162 303Q170 188 350 180Q442 136 600 175Q816 140 1005 228Q1118 298 1074 470Q1134 654 1054 806Q908 905 727 867Q517 938 306 849Q130 830 137 678Q72 493 162 303Z" fill="#e6ebda" stroke="#c6d1b9" stroke-width="2"/>
  <path d="M161 651Q87 464 183 306Q268 191 373 217M743 179Q987 164 1066 325Q1105 401 1078 474M986 855Q842 915 730 872Q520 934 357 876" fill="none" stroke="#a6c9bb" stroke-width="17" stroke-linecap="round" opacity=".55"/>
  <path d="M160 651Q100 466 194 315Q280 213 373 224M749 187Q985 180 1055 329Q1094 403 1069 472" fill="none" stroke="#eaf6e9" stroke-width="5" stroke-linecap="round"/>
  <g opacity=".9"><use href="#plant" x="174" y="333"/><use href="#plant" x="218" y="248"/><use href="#plant" x="304" y="217"/><use href="#plant" x="644" y="208"/><use href="#plant" x="1077" y="443"/><use href="#plant" x="1072" y="554"/><use href="#plant" x="1037" y="789"/><use href="#plant" x="822" y="868"/><use href="#plant" x="714" y="886"/><use href="#plant" x="266" y="827"/><use href="#plant" x="161" y="697"/><use href="#plant" x="150" y="551"/></g>

  <!-- Main circulation is wide and traversable; buildings sit outside it. -->
  <path d="M409 430Q440 369 535 340Q667 307 810 360Q869 491 800 660Q672 726 500 660Q376 598 409 430Z" fill="none" stroke="#d8cdb1" stroke-width="55" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M409 430Q440 369 535 340Q667 307 810 360Q869 491 800 660Q672 726 500 660Q376 598 409 430Z" fill="none" stroke="#fff4d9" stroke-width="45" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M409 430Q470 504 625 580Q711 624 800 660M625 580Q612 707 655 813" fill="none" stroke="#d8cdb1" stroke-width="48" stroke-linecap="round"/>
  <path d="M409 430Q470 504 625 580Q711 624 800 660M625 580Q612 707 655 813" fill="none" stroke="#fff4d9" stroke-width="38" stroke-linecap="round"/>
  <path d="M325 391L409 430M507 285L535 340M906 317L810 360M420 714L500 660M889 697L800 660" stroke="#d8cdb1" stroke-width="37" stroke-linecap="round"/>
  <path d="M325 391L409 430M507 285L535 340M906 317L810 360M420 714L500 660M889 697L800 660" stroke="#fff4d9" stroke-width="29" stroke-linecap="round"/>
  <path d="M443 390Q481 357 520 351M690 330Q744 330 787 350M846 459Q859 507 835 557M744 695Q690 715 634 707M445 625Q405 590 404 553" stroke="#789480" stroke-width="2.2" fill="none" marker-end="url(#arrow)" opacity=".85"/>

  <!-- Central garden. -->
  <ellipse cx="625" cy="476" rx="116" ry="88" fill="#e4cfac"/>
  <ellipse cx="625" cy="470" rx="108" ry="81" fill="#f9e9cc" stroke="#fef9e7" stroke-width="6"/>
  <ellipse cx="625" cy="478" rx="73" ry="54" fill="#bfd8ba"/>
  <path d="M625 491Q555 448 586 406Q615 425 625 442Q626 395 648 388Q694 446 625 491Z" fill="#edae99" stroke="#be8b74" stroke-width="2"/>
  <path d="M625 487Q605 452 614 425Q636 448 625 487" fill="#fff4c9"/>
  <ellipse cx="625" cy="491" rx="47" ry="12" fill="#f9f4d8"/>
  <use href="#plant" x="548" y="474"/><use href="#plant" x="699" y="473"/>
  <rect x="550" y="520" width="39" height="10" rx="5" fill="#a8ba9b" transform="rotate(20 550 520)"/>
  <rect x="665" y="533" width="39" height="10" rx="5" fill="#a8ba9b" transform="rotate(-20 665 533)"/>
  <rect x="550" y="554" width="151" height="33" rx="16" fill="#fffdf5" stroke="#d4cbb6"/>
  <text x="626" y="577" text-anchor="middle" font-size="18" font-weight="700">01 心核庭院</text>

  <!-- Warehouse cluster. -->
  <path d="M184 355Q181 276 280 267Q374 275 374 374L316 409L219 398Z" fill="#d0e0c5" stroke="#a5bea0" stroke-width="2"/>
  <path d="M222 373Q213 309 278 292Q340 303 345 373Z" fill="#8eb79c" stroke="#557f67" stroke-width="3"/>
  <path d="M257 373Q254 334 284 330Q310 338 310 373Z" fill="#426e5a" stroke="#fcf3d8" stroke-width="9"/>
  <path d="M278 302L240 348M278 302L324 348" stroke="#bdd3b6" stroke-width="3"/>
  <g fill="#f6efd6" stroke="#9da78c" stroke-width="2"><rect x="199" y="375" width="28" height="22" rx="5"/><rect x="230" y="382" width="28" height="22" rx="5"/><rect x="329" y="380" width="28" height="22" rx="5"/></g>
  <path d="M337 321V353M325 328H349M325 340H349" stroke="#7d9180" stroke-width="5" stroke-linecap="round"/>
  <rect x="196" y="421" width="176" height="59" rx="11" fill="#fffdf5" filter="url(#shadow)"/>
  <text x="284" y="447" text-anchor="middle" font-size="20" font-weight="700">02 免疫仓库</text>
  <text x="284" y="469" text-anchor="middle" font-size="13" fill="#788b78">陈列架 · 搬运 · 配装</text>

  <!-- Forge, adjacent to warehouse. -->
  <ellipse cx="510" cy="248" rx="94" ry="60" fill="#e9d9b9" stroke="#d5c19e" stroke-width="2"/>
  <path d="M443 237Q453 182 513 181Q575 185 583 237L554 249L474 249Z" fill="#b8ccaf" stroke="#7b9e7e" stroke-width="2"/>
  <path d="M458 239V272M570 239V272" stroke="#718f79" stroke-width="8"/>
  <path d="M484 252H539L530 266H499L495 278H532V288H485V278H497L499 266Z" fill="#637c78"/>
  <circle cx="513" cy="244" r="13" fill="#f4c079"/><circle cx="513" cy="244" r="7" fill="#fff0b5"/>
  <g fill="#ae9977"><rect x="441" y="269" width="17" height="16" rx="3"/><rect x="562" y="271" width="18" height="15" rx="3"/></g>
  <rect x="420" y="120" width="188" height="59" rx="11" fill="#fffdf5" filter="url(#shadow)"/>
  <text x="514" y="146" text-anchor="middle" font-size="20" font-weight="700">03 生命锻造坊</text>
  <text x="514" y="168" text-anchor="middle" font-size="13" fill="#788b78">修复 · 强化 · 工匠演出</text>

  <!-- Training court. -->
  <rect x="853" y="234" width="173" height="121" rx="38" fill="#deebdf" stroke="#94b9a5" stroke-width="2"/>
  <path d="M882 334V259M937 334V259M991 334V259" stroke="#c0d5c4" stroke-width="17" stroke-linecap="round"/>
  <use href="#target" x="882" y="267"/><use href="#target" x="937" y="267"/><use href="#target" x="991" y="267"/>
  <path d="M851 250Q869 217 891 220M1002 221Q1030 221 1036 256" stroke="#6f9e84" stroke-width="6" fill="none"/>
  <rect x="846" y="149" width="194" height="59" rx="11" fill="#fffdf5" filter="url(#shadow)"/>
  <text x="943" y="175" text-anchor="middle" font-size="20" font-weight="700">04 安全试枪场</text>
  <text x="943" y="197" text-anchor="middle" font-size="13" fill="#788b78">独立入口 · 靶场预览</text>

  <!-- Supply courtyard. -->
  <ellipse cx="347" cy="706" rx="107" ry="68" fill="#dde3bd" stroke="#bac7a1" stroke-width="2"/>
  <path d="M276 698Q273 641 336 633Q393 645 395 693Z" fill="#94b798" stroke="#6d9578" stroke-width="2"/>
  <path d="M296 689V729M374 689V729" stroke="#78977f" stroke-width="6"/>
  <rect x="288" y="710" width="95" height="22" rx="5" fill="#f4e6c9" stroke="#b4ab8a" stroke-width="2"/>
  <g fill="#adc8b0" stroke="#6e9b81" stroke-width="2"><rect x="300" y="696" width="12" height="16" rx="4"/><rect x="320" y="696" width="12" height="16" rx="4"/><rect x="340" y="696" width="12" height="16" rx="4"/></g>
  <rect x="402" y="692" width="43" height="18" rx="8" fill="#b7cd97"/>
  <rect x="397" y="723" width="43" height="18" rx="8" fill="#b7cd97"/>
  <use href="#plant" x="423" y="691"/><use href="#plant" x="418" y="725"/>
  <rect x="266" y="778" width="194" height="59" rx="11" fill="#fffdf5" filter="url(#shadow)"/>
  <text x="363" y="804" text-anchor="middle" font-size="20" font-weight="700">05 补给庭院</text>
  <text x="363" y="826" text-anchor="middle" font-size="13" fill="#788b78">备货 · 药草 · 休憩</text>

  <!-- Expedition landmark. -->
  <ellipse cx="937" cy="689" rx="104" ry="73" fill="#cfe1ce" stroke="#94b6a0" stroke-width="3"/>
  <ellipse cx="937" cy="691" rx="71" ry="48" fill="#edf3df" stroke="#a1c3aa" stroke-width="2"/>
  <path d="M880 691Q866 611 918 588L937 616Q910 634 910 691Z" fill="#7ca88e" stroke="#517f65" stroke-width="2"/>
  <path d="M994 691Q1008 611 956 588L937 616Q965 634 964 691Z" fill="#9bbe9c" stroke="#517f65" stroke-width="2"/>
  <path d="M937 658V711M924 697L937 712L950 697" fill="none" stroke="#7fb5a1" stroke-width="7" stroke-linecap="round"/>
  <path d="M997 708Q1058 719 1103 769" fill="none" stroke="#a2c8b4" stroke-width="16" stroke-linecap="round"/>
  <rect x="844" y="778" width="210" height="59" rx="11" fill="#fffdf5" filter="url(#shadow)"/>
  <text x="949" y="804" text-anchor="middle" font-size="20" font-weight="700">06 远征出击台</text>
  <text x="949" y="826" text-anchor="middle" font-size="13" fill="#788b78">集合前场 · 远征门户</text>

  <!-- Residents, not combat units. -->
  <use href="#cell" x="366" y="389"/><use href="#cell" x="337" y="486"/>
  <use href="#cell" x="553" y="289"/><use href="#cell" x="449" y="294"/>
  <use href="#cell" x="922" y="330"/><use href="#cell" x="801" y="396"/>
  <use href="#cell" x="277" y="750"/><use href="#cell" x="383" y="756"/>
  <use href="#cell" x="906" y="726"/><use href="#cell" x="968" y="734"/>
  <use href="#cell" x="709" y="529"/>
  <g transform="translate(628 644)"><ellipse cy="24" rx="19" ry="8" fill="#365f4e" opacity=".15"/><rect x="-15" y="-2" width="30" height="33" rx="12" fill="#c9dacf" stroke="#527b68" stroke-width="2"/><circle cy="-15" r="22" fill="#fefcf1" stroke="#527b68" stroke-width="2"/><rect x="-13" y="-19" width="26" height="13" rx="5" fill="#355e52"/><circle cx="5" cy="-13" r="3" fill="#bfe4d2"/></g>
  <text x="651" y="866" text-anchor="middle" font-size="16" fill="#6b8471">回营落点 → 心核可见，环路可达</text>
  <path d="M656 819L640 761" stroke="#597564" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  </g>
  <!-- Bottom notes. -->
  <rect x="66" y="940" width="1082" height="87" rx="17" fill="#eeeddf"/>
  <text x="89" y="971" font-size="17" font-weight="700">空间目标</text>
  <text x="207" y="971" font-size="16" fill="#667d69">功能区之间有空隙，主路宽 3–4 个角色；装饰集中在区内与边缘。</text>
  <text x="89" y="1002" font-size="14" fill="#7a8876">布局示意，非游戏实测画面；坐标、碰撞与镜头范围将在落地时校准。</text>

  <!-- Editorial sidebar. -->
  <rect x="1208" width="472" height="1080" fill="#274b3f"/>
  <g fill="#f4f2e2">
    <text x="1252" y="77" font-size="14" letter-spacing="2" fill="#b2c6af">DESIGN INTENT</text>
    <text x="1252" y="127" font-size="30" font-weight="700">让玩家愿意回营</text>
    <path d="M1252 161H1626" stroke="#658573"/>
    <text x="1252" y="211" font-size="21" font-weight="700">聚落感</text>
    <text x="1252" y="246" font-size="16" fill="#ccdac6">一栋主建筑，搭配陈列、工位和小景。</text>
    <text x="1252" y="274" font-size="16" fill="#ccdac6">每个区域都有正在发生的事情。</text>
    <text x="1252" y="339" font-size="21" font-weight="700">清楚的整备顺序</text>
    <text x="1252" y="374" font-size="16" fill="#ccdac6">仓库 → 锻造 → 试枪 → 补给 → 出击</text>
    <text x="1252" y="402" font-size="16" fill="#ccdac6">环路方便逛，穿心支路提供捷径。</text>
    <text x="1252" y="467" font-size="21" font-weight="700">有主次的视觉吸引</text>
    <text x="1252" y="502" font-size="16" fill="#ccdac6">心核的暖光是归属，出击门是方向。</text>
    <text x="1252" y="530" font-size="16" fill="#ccdac6">用造型和材质分区，减少文字依赖。</text>
    <text x="1252" y="595" font-size="21" font-weight="700">常驻的营地生活</text>
    <text x="1252" y="630" font-size="16" fill="#ccdac6">搬运、锻造、照料药草、准备远征。</text>
    <text x="1252" y="658" font-size="16" fill="#ccdac6">居民为氛围表现，不阻挡玩家通行。</text>
    <text x="1252" y="723" font-size="21" font-weight="700">看得见的收藏成长</text>
    <text x="1252" y="758" font-size="16" fill="#ccdac6">已有武器摆上架，修复台展示配装。</text>
    <text x="1252" y="786" font-size="16" fill="#ccdac6">试枪场入口把现有功能带进场景。</text>
    <path d="M1252 843H1626" stroke="#658573"/>
    <text x="1252" y="884" font-size="16" font-weight="700" fill="#e6dfb6">建议规模</text>
    <text x="1252" y="923" font-size="25" font-weight="700">5 个功能区 ＋ 1 个心核</text>
    <text x="1252" y="961" font-size="17" fill="#ccdac6">10–12 名常驻细胞 · 清爽通行空间</text>
    <text x="1252" y="1027" font-size="13" fill="#b2c6af">设计草案 / 2026.11.05 / 尚未修改游戏</text>
  </g>
</g>
</svg>
